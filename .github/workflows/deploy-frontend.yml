name: Deploy frontend and API

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "api/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend and API
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_PORT: ${{ secrets.SSH_PORT || '65002' }}
      DEPLOY_USER: ${{ secrets.SSH_USERNAME || 'u839013241' }}
      DEPLOY_PATH: /home/u839013241/domains/kooteefamily.com/public_html/portfolio
      DEPLOY_URL: https://kooteefamily.com/portfolio

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Assemble deployment package
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD" || { echo "Missing DB_PASSWORD secret"; exit 1; }

          install -d deploy-package/api
          cp -a frontend/dist/. deploy-package/
          cp -a api/. deploy-package/api/

          encoded_password="$(printf '%s' "$DB_PASSWORD" | base64 -w 0)"
          cat > deploy-package/api/config.php <<EOF
          <?php

          declare(strict_types=1);

          // Generated during deployment from the GitHub DB_PASSWORD secret.
          return [
              'database' => [
                  'password' => base64_decode('$encoded_password', true),
              ],
          ];
          EOF
          chmod 600 deploy-package/api/config.php

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing SSH_HOST secret"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SSH_PRIVATE_KEY secret"; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend and API files
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            deploy-package/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Verify deployed API
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 \
            "$DEPLOY_URL/api/health"
